name: Import Helpdesk Pro

on:
  push:
    branches: ["19.0"]
    paths:
      - ".github/workflows/import_helpdesk.yml"
      - ".tmp/helpdesk_core.b64"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "19.0"
      - name: Extract Helpdesk Pro
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp/helpdesk_core.b64 > /tmp/helpdesk_core.zip
          rm -rf custom_addons/helpdesk_community_pro
          unzip -q /tmp/helpdesk_core.zip -d custom_addons
          rm -f custom_addons/helpdesk_community_pro/IMPORT_NOTE.txt
          rm -f .tmp/helpdesk_core.b64
          rm -f .github/workflows/import_helpdesk.yml
      - name: Commit imported module
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[ADD] helpdesk_community_pro 19.0.1.0.0" || exit 0
          git push origin HEAD:19.0
