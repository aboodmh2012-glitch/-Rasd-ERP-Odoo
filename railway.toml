[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/web/login"
healthcheckTimeout = 900
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1

# Persistent filestore / sessions for Odoo attachments
[[mounts]]
source = "masar_odoo_data"
destination = "/var/lib/odoo"
